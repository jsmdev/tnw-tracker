name: CI
on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint --filter='[origin/${{ github.base_ref }}]'

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck --filter='[origin/${{ github.base_ref }}]'

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo test --filter='[origin/${{ github.base_ref }}]'

  test-pgtap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db
      - run: supabase stop

  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=admin

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript,actions
      - uses: github/codeql-action/analyze@v3

  swift-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check for Swift files
        id: swift-check
        run: |
          count=$(find apps/ios -name "*.swift" 2>/dev/null | wc -l)
          echo "count=$count" >> $GITHUB_OUTPUT
      - uses: norio-nomura/action-swiftlint@3.2.1
        if: steps.swift-check.outputs.count != '0'
        with:
          args: --strict apps/ios

  e2e-playwright:
    if: github.base_ref == 'main'
    needs: build-admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Vercel Preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.3
        id: vercel
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300
      - uses: pnpm/action-setup@v4
        if: steps.vercel.outputs.url != ''
      - uses: actions/setup-node@v4
        if: steps.vercel.outputs.url != ''
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.vercel.outputs.url != ''
      - run: pnpm --filter admin exec playwright install --with-deps chromium
        if: steps.vercel.outputs.url != ''
      - run: pnpm --filter admin test:e2e
        if: steps.vercel.outputs.url != ''
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.vercel.outputs.url }}
