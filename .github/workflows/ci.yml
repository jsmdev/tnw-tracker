name: CI
on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-pgtap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v2
        with:
          version: 3.2.0
      - run: supabase start
      - run: supabase test db
      - run: supabase stop

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  training-data-format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r docs/training-data/requirements.txt
      # Validates the examples against the schema and the cross-reference rules.
      - run: python docs/training-data/validate.py

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,actions
      - uses: github/codeql-action/analyze@v4

  swift-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Check for Swift files
        id: swift-check
        run: |
          count=$(find apps/ios -name "*.swift" 2>/dev/null | wc -l)
          echo "count=$count" >> $GITHUB_OUTPUT
      - uses: norio-nomura/action-swiftlint@3.2.1
        if: steps.swift-check.outputs.count != '0'
        with:
          args: --strict apps/ios
