name: Deploy Dev
on:
  push:
    branches: [develop]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT_TYPEGEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Run migrations
        run: supabase db push
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Generate TypeScript types
        run: |
          pnpm dlx supabase@latest gen types typescript \
            --project-id ${{ secrets.SUPABASE_PROJECT_REF }} \
            > packages/database/types.gen.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Commit types if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/types.gen.ts
          if ! git diff --staged --quiet; then
            git commit -m "chore(db): regenerate supabase types [skip ci]"
            git push
          else
            echo "No type changes to commit"
          fi
