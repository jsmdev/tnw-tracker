name: TnwTracker
options:
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
targets:
  TNWTracker:
    type: application
    platform: iOS
    sources: TNWTracker/
    settings:
      base:
        INFOPLIST_FILE: TNWTracker/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.tnwtracker.app
    dependencies:
      - target: TNWTrackerKit
    entitlements:
      path: TNWTracker/TNWTracker.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tnwtracker.shared]
  TNWTrackerWidget:
    type: app-extension
    platform: iOS
    sources: TNWTrackerWidget/Sources/
    settings:
      base:
        INFOPLIST_FILE: TNWTrackerWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.tnwtracker.widget
    dependencies:
      - target: TNWTrackerKit
    entitlements:
      path: TNWTrackerWidget/TNWTrackerWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tnwtracker.shared]
  TNWTrackerKit:
    type: framework
    platform: iOS
    sources: TNWTrackerKit/Sources/
    settings:
      base:
        INFOPLIST_FILE: TNWTrackerKit/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.tnwtracker.kit
    dependencies:
      - package: supabase-swift
        product: Supabase
  TNWTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: TNWTrackerTests/
    settings:
      base:
        INFOPLIST_FILE: TNWTrackerTests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.tnwtracker.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TNWTracker.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TNWTracker"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: TNWTracker
      - target: TNWTrackerKit
schemes:
  TNWTracker:
    build:
      targets:
        TNWTracker: all
        TNWTrackerTests: [test]
    test:
      targets:
        - TNWTrackerTests
